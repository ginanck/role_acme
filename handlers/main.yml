---
# handlers file for role_acme

- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: enable certbot renewal timer
  ansible.builtin.systemd:
    name: certbot-renewal.timer
    state: started
    enabled: true

- name: run deploy hooks
  # Execute every executable hook in the certbot deploy directory. run-parts is
  # not guaranteed to be installed on minimal images, so glob explicitly.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      shopt -s nullglob
      for hook in "{{ acme_hook_dir }}"/*; do
          if [ -f "${hook}" ] && [ -x "${hook}" ]; then
              "${hook}"
          fi
      done
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  failed_when: false

- name: reload haproxy
  ansible.builtin.service:
    name: haproxy
    state: reloaded
  failed_when: false
