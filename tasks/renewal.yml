---
# tasks/renewal.yml - Configure exactly one automated certificate renewal path
#
# A host must never run two renewal mechanisms. Whichever mechanism the operator
# selects, every other certbot renewal trigger (the vendor timer shipped by the
# certbot package, and the role's own timer when cron is selected) is disabled
# and masked so a package update cannot silently re-enable it.

- name: Load OS Family Renewal Unit Handling
  ansible.builtin.include_tasks: "os_family/{{ ansible_facts['os_family'] }}.yml"

- name: Flush Handlers After Masking Vendor Timers
  ansible.builtin.meta: flush_handlers

# ----------------------------------------------------------------
# Systemd timer-based renewal
# ----------------------------------------------------------------

- name: Deploy Certbot Renewal Systemd Service Unit
  ansible.builtin.template:
    src: certbot-renewal.service.j2
    dest: /etc/systemd/system/certbot-renewal.service
    owner: root
    group: root
    mode: "0644"
  when: _acme_effective_renewal_method == 'systemd'
  notify: reload systemd daemon

- name: Deploy Certbot Renewal Systemd Timer Unit
  ansible.builtin.template:
    src: certbot-renewal.timer.j2
    dest: /etc/systemd/system/certbot-renewal.timer
    owner: root
    group: root
    mode: "0644"
  when: _acme_effective_renewal_method == 'systemd'
  notify:
    - reload systemd daemon
    - enable certbot renewal timer

- name: Flush Handlers to Ensure Systemd Units are Loaded
  ansible.builtin.meta: flush_handlers

- name: Enable and Start Certbot Renewal Timer
  ansible.builtin.systemd:
    name: certbot-renewal.timer
    state: started
    enabled: true
    masked: false
    daemon_reload: true
  when: _acme_effective_renewal_method == 'systemd'

# ----------------------------------------------------------------
# Cron-based renewal
# ----------------------------------------------------------------

- name: Configure Certbot Renewal Cron Job
  # certbot runs executable scripts from renewal-hooks/{pre,post,deploy} itself,
  # so no --deploy-hook/--renew-hook flag is needed (or wanted) here. The
  # environment file carries the trust root used for renewal.
  ansible.builtin.cron:
    name: "certbot-renewal"
    minute: "{{ acme_renewal_cron_minute }}"
    hour: "{{ acme_renewal_cron_hour }}"
    day: "{{ acme_renewal_cron_day }}"
    month: "{{ acme_renewal_cron_month }}"
    weekday: "{{ acme_renewal_cron_weekday }}"
    user: "{{ acme_renewal_cron_user }}"
    job: >-
      set -a; [ -r {{ acme_renewal_env_file }} ] && . {{ acme_renewal_env_file }}; set +a;
      {{ acme_certbot_bin }} renew --quiet >> {{ acme_renewal_log_file }} 2>&1
    cron_file: certbot-renewal
  when: _acme_effective_renewal_method == 'cron'

# ----------------------------------------------------------------
# Cleanup: make sure the method not in use cannot run
# ----------------------------------------------------------------

- name: Check If Crontab is Available
  ansible.builtin.command:
    cmd: which crontab
  register: acme_crontab_check
  changed_when: false
  failed_when: false

- name: Remove Cron Job When Using Systemd Timer
  ansible.builtin.cron:
    name: "certbot-renewal"
    cron_file: certbot-renewal
    state: absent
  when:
    - _acme_effective_renewal_method == 'systemd'
    - acme_crontab_check.rc == 0

- name: Check Whether the Role-Owned Timer Unit Exists
  ansible.builtin.stat:
    path: /etc/systemd/system/certbot-renewal.timer
  register: _acme_role_timer_unit
  when: _acme_effective_renewal_method == 'cron'

- name: Disable Role Timer When Using Cron
  ansible.builtin.systemd:
    name: certbot-renewal.timer
    state: stopped
    enabled: false
  when:
    - _acme_effective_renewal_method == 'cron'
    - _acme_role_timer_unit.stat.exists

- name: Remove Role Timer Unit When Using Cron
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/certbot-renewal.timer
    - /etc/systemd/system/certbot-renewal.service
  when:
    - _acme_effective_renewal_method == 'cron'
    - _acme_role_timer_unit.stat.exists
