---
# tasks/renewal.yml - Configure automated certificate renewal

# ----------------------------------------------------------------
# Systemd timer-based renewal
# ----------------------------------------------------------------

- name: Deploy Certbot Renewal Systemd Service Unit
  ansible.builtin.template:
    src: certbot-renewal.service.j2
    dest: /etc/systemd/system/certbot-renewal.service
    owner: root
    group: root
    mode: "0644"
  when: acme_renewal_method == 'systemd'
  notify: reload systemd daemon

- name: Deploy Certbot Renewal Systemd Timer Unit
  ansible.builtin.template:
    src: certbot-renewal.timer.j2
    dest: /etc/systemd/system/certbot-renewal.timer
    owner: root
    group: root
    mode: "0644"
  when: acme_renewal_method == 'systemd'
  notify:
    - reload systemd daemon
    - enable certbot renewal timer

- name: Flush Handlers to Ensure Systemd Units are Loaded
  ansible.builtin.meta: flush_handlers

- name: Enable and Start Certbot Renewal Timer
  ansible.builtin.systemd:
    name: certbot-renewal.timer
    state: started
    enabled: true
    daemon_reload: true
  when: acme_renewal_method == 'systemd'

# ----------------------------------------------------------------
# Cron-based renewal
# ----------------------------------------------------------------

- name: Configure Certbot Renewal Cron Job
  ansible.builtin.cron:
    name: "certbot-renewal"
    minute: "{{ acme_renewal_cron_minute }}"
    hour: "{{ acme_renewal_cron_hour }}"
    day: "{{ acme_renewal_cron_day }}"
    month: "{{ acme_renewal_cron_month }}"
    weekday: "{{ acme_renewal_cron_weekday }}"
    user: "{{ acme_renewal_cron_user }}"
    job: >-
      {{ acme_certbot_bin }} renew --quiet
      --deploy-hook "{{ acme_deploy_hook_dir }}/acme-combine-pem.sh"
      >> {{ acme_renewal_log_file }} 2>&1
    cron_file: certbot-renewal
  when: acme_renewal_method == 'cron'

# ----------------------------------------------------------------
# Cleanup: remove the method not in use
# ----------------------------------------------------------------

- name: Remove Cron Job When Using Systemd Timer
  ansible.builtin.cron:
    name: "certbot-renewal"
    cron_file: certbot-renewal
    state: absent
  when: acme_renewal_method == 'systemd'

- name: Disable Systemd Timer When Using Cron
  ansible.builtin.systemd:
    name: certbot-renewal.timer
    state: stopped
    enabled: false
  when: acme_renewal_method == 'cron'
  failed_when: false
