---
# tasks/issue.yml - Issue ACME certificates

- name: Check Existing Certificate Validity
  ansible.builtin.command:
    cmd: >
      openssl x509 -in {{ acme_cert_dir }}/{{ item.name }}/fullchain.pem
      -noout -checkend {{ (acme_renewal_days_before_expiry * 86400) | int }}
  register: acme_cert_check_results
  loop: "{{ acme_certificates | selectattr('enabled', 'undefined') | list +
            acme_certificates | selectattr('enabled', 'defined') | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  failed_when: false

- name: Backup Existing Certificates Before Renewal
  when: acme_backup_enabled
  block:
    - name: Create Per-Certificate Backup Directory
      ansible.builtin.file:
        path: "{{ acme_backup_dir }}/{{ item.item.name }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: "{{ acme_cert_check_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc == 1

    - name: Archive Current Certificates
      community.general.archive:
        path: "{{ acme_cert_dir }}/{{ item.item.name }}"
        dest: "{{ acme_backup_dir }}/{{ item.item.name }}/{{ item.item.name }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
      loop: "{{ acme_cert_check_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc == 1

    - name: Clean Up Old Backups
      ansible.builtin.shell:
        cmd: >
          ls -1t {{ acme_backup_dir }}/{{ item.item.name }}/*.tar.gz 2>/dev/null |
          tail -n +{{ acme_backup_retain + 1 }} |
          xargs -r rm -f
      args:
        executable: /bin/bash
      loop: "{{ acme_cert_check_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc == 1
      changed_when: false

- name: Issue Certificates via HTTP-01 Webroot Challenge
  ansible.builtin.command:
    cmd: >
      {{ acme_certbot_bin }} certonly
      --non-interactive
      --agree-tos
      --email {{ acme_email }}
      --server {{ _acme_server_url }}
      --webroot
      --webroot-path {{ acme_http01_webroot }}
      --cert-name {{ item.item.name }}
      {{ _acme_domain_flags }}
      --key-type {{ item.item.key_type | default(acme_default_key_type) }}
      {% if (item.item.key_type | default(acme_default_key_type)) == 'rsa' %}
      --rsa-key-size {{ item.item.key_size | default(acme_default_key_size) }}
      {% else %}
      --elliptic-curve secp{{ item.item.key_size | default(acme_default_key_size) }}r1
      {% endif %}
      {% if acme_preferred_chain | length > 0 %}
      --preferred-chain "{{ acme_preferred_chain }}"
      {% endif %}
      {% if acme_force_renewal %}
      --force-renewal
      {% endif %}
      {% if acme_dry_run %}
      --dry-run
      {% endif %}
  vars:
    _acme_server_url: >-
      {% if acme_provider == 'custom' %}{{ acme_custom_server_url }}{% elif acme_staging %}{{ acme_provider_urls[acme_provider].staging }}{% else %}{{ acme_provider_urls[acme_provider].production }}{% endif %}
    _acme_domain_flags: >-
      {% for domain in item.item.domains %}-d {{ domain }} {% endfor %}
  loop: "{{ acme_cert_check_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.item.enabled | default(true))
    - (item.item.challenge | default('http-01')) == 'http-01'
    - item.rc != 0 or acme_force_renewal
  changed_when: true
  notify: run deploy hooks

- name: Issue Certificates via DNS-01 Challenge
  ansible.builtin.command:
    cmd: >
      {{ acme_certbot_bin }} certonly
      --non-interactive
      --agree-tos
      --email {{ acme_email }}
      --server {{ _acme_server_url }}
      --dns-{{ acme_dns01_provider }}
      {% if acme_dns01_credentials_file | length > 0 %}
      --dns-{{ acme_dns01_provider }}-credentials {{ acme_dns01_credentials_file }}
      {% endif %}
      --dns-{{ acme_dns01_provider }}-propagation-seconds {{ acme_dns01_propagation_seconds }}
      --cert-name {{ item.item.name }}
      {{ _acme_domain_flags }}
      --key-type {{ item.item.key_type | default(acme_default_key_type) }}
      {% if (item.item.key_type | default(acme_default_key_type)) == 'rsa' %}
      --rsa-key-size {{ item.item.key_size | default(acme_default_key_size) }}
      {% else %}
      --elliptic-curve secp{{ item.item.key_size | default(acme_default_key_size) }}r1
      {% endif %}
      {% if acme_preferred_chain | length > 0 %}
      --preferred-chain "{{ acme_preferred_chain }}"
      {% endif %}
      {% if acme_force_renewal %}
      --force-renewal
      {% endif %}
      {% if acme_dry_run %}
      --dry-run
      {% endif %}
  vars:
    _acme_server_url: >-
      {% if acme_provider == 'custom' %}{{ acme_custom_server_url }}{% elif acme_staging %}{{ acme_provider_urls[acme_provider].staging }}{% else %}{{ acme_provider_urls[acme_provider].production }}{% endif %}
    _acme_domain_flags: >-
      {% for domain in item.item.domains %}-d {{ domain }} {% endfor %}
  loop: "{{ acme_cert_check_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.item.enabled | default(true))
    - (item.item.challenge | default('http-01')) == 'dns-01'
    - item.rc != 0 or acme_force_renewal
  changed_when: true
  notify: run deploy hooks

- name: Determine Standalone Certificates Needing Issuance
  ansible.builtin.set_fact:
    _acme_standalone_certs_needed: >-
      {{ acme_cert_check_results.results
         | selectattr('item.challenge', 'defined')
         | selectattr('item.challenge', 'equalto', 'standalone')
         | rejectattr('item.enabled', 'defined')
         | list
         +
         acme_cert_check_results.results
         | selectattr('item.challenge', 'defined')
         | selectattr('item.challenge', 'equalto', 'standalone')
         | selectattr('item.enabled', 'defined')
         | selectattr('item.enabled', 'equalto', true)
         | list }}

- name: Check Which Standalone Certificates Already Exist
  ansible.builtin.stat:
    path: "{{ acme_cert_dir }}/{{ item.item.name }}/fullchain.pem"
  register: _acme_standalone_cert_exists
  loop: "{{ _acme_standalone_certs_needed }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Initial Issuance of Standalone Certificates via Port 80
  when: _acme_standalone_cert_exists.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
  block:
    - name: Check If Port 80 Is Already In Use
      ansible.builtin.command:
        cmd: ss -tlnp sport = :80
      register: _acme_port80_check
      changed_when: false
      failed_when: false

    - name: Identify Service Using Port 80
      ansible.builtin.set_fact:
        _acme_port80_service: >-
          {{ _acme_port80_check.stdout | default('')
             | regex_search('users:\(\("([^"]+)"', '\1')
             | default([], true) | first | default('') }}
      when: _acme_port80_check.stdout | default('') | regex_search('LISTEN')

    - name: Stop Service Using Port 80 for Initial Certificate Issuance
      ansible.builtin.systemd:
        name: "{{ _acme_port80_service }}"
        state: stopped
      when: _acme_port80_service | default('') | length > 0

    - name: Issue New Standalone Certificates on Port 80
      ansible.builtin.command:
        cmd: >
          {{ acme_certbot_bin }} certonly
          --non-interactive
          --agree-tos
          --email {{ acme_email }}
          --server {{ _acme_server_url }}
          --standalone
          --preferred-challenges http
          --http-01-port 80
          --cert-name {{ item.item.item.name }}
          {{ _acme_domain_flags }}
          --key-type {{ item.item.item.key_type | default(acme_default_key_type) }}
          {% if (item.item.item.key_type | default(acme_default_key_type)) == 'rsa' %}
          --rsa-key-size {{ item.item.item.key_size | default(acme_default_key_size) }}
          {% else %}
          --elliptic-curve secp{{ item.item.item.key_size | default(acme_default_key_size) }}r1
          {% endif %}
          {% if acme_preferred_chain | length > 0 %}
          --preferred-chain "{{ acme_preferred_chain }}"
          {% endif %}
          {% if acme_dry_run %}
          --dry-run
          {% endif %}
      vars:
        _acme_server_url: >-
          {% if acme_provider == 'custom' %}{{ acme_custom_server_url }}{% elif acme_staging %}{{ acme_provider_urls[acme_provider].staging }}{% else %}{{ acme_provider_urls[acme_provider].production }}{% endif %}
        _acme_domain_flags: >-
          {% for domain in item.item.item.domains %}-d {{ domain }} {% endfor %}
      loop: "{{ _acme_standalone_cert_exists.results }}"
      loop_control:
        label: "{{ item.item.item.name }}"
      when: not item.stat.exists
      changed_when: true
      notify: run deploy hooks

  always:
    - name: Restart Service That Was Using Port 80
      ansible.builtin.systemd:
        name: "{{ _acme_port80_service }}"
        state: started
      when: _acme_port80_service | default('') | length > 0

- name: Renew Expiring Standalone Certificates via Configured Port
  ansible.builtin.command:
    cmd: >
      {{ acme_certbot_bin }} certonly
      --non-interactive
      --agree-tos
      --email {{ acme_email }}
      --server {{ _acme_server_url }}
      --standalone
      --preferred-challenges http
      --http-01-port {{ acme_standalone_renewal_port | default(acme_standalone_http_port, true) }}
      --cert-name {{ item.item.name }}
      {{ _acme_domain_flags }}
      --key-type {{ item.item.key_type | default(acme_default_key_type) }}
      {% if (item.item.key_type | default(acme_default_key_type)) == 'rsa' %}
      --rsa-key-size {{ item.item.key_size | default(acme_default_key_size) }}
      {% else %}
      --elliptic-curve secp{{ item.item.key_size | default(acme_default_key_size) }}r1
      {% endif %}
      {% if acme_preferred_chain | length > 0 %}
      --preferred-chain "{{ acme_preferred_chain }}"
      {% endif %}
      {% if acme_force_renewal %}
      --force-renewal
      {% endif %}
      {% if acme_dry_run %}
      --dry-run
      {% endif %}
  vars:
    _acme_server_url: >-
      {% if acme_provider == 'custom' %}{{ acme_custom_server_url }}{% elif acme_staging %}{{ acme_provider_urls[acme_provider].staging }}{% else %}{{ acme_provider_urls[acme_provider].production }}{% endif %}
    _acme_domain_flags: >-
      {% for domain in item.item.domains %}-d {{ domain }} {% endfor %}
  loop: "{{ _acme_standalone_certs_needed }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.rc != 0 or acme_force_renewal)
    - item.stderr | default('') is not search('No such file or directory')
  changed_when: true
  notify: run deploy hooks

- name: Set Renewal Port in Certbot Config for Future Renewals
  ansible.builtin.lineinfile:
    path: "{{ acme_renewal_config_dir }}/{{ item.item.name }}.conf"
    regexp: '^http01_port\s*='
    line: "http01_port = {{ acme_standalone_renewal_port | default(acme_standalone_http_port, true) }}"
  loop: "{{ acme_cert_check_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.item.enabled | default(true))
    - (item.item.challenge | default('http-01')) == 'standalone'
    - not acme_dry_run

- name: Set Automatic Renewal Threshold in Certbot Config
  # Injects `renew_before_expiry = N days` into certbot's own renewal config so
  # the systemd timer renews N days before expiry. Per-cert `renew_before_expiry`
  # overrides the role-wide acme_renewal_days_before_expiry default.
  ansible.builtin.lineinfile:
    path: "{{ acme_renewal_config_dir }}/{{ item.item.name }}.conf"
    regexp: '^renew_before_expiry\s*='
    line: "renew_before_expiry = {{ item.item.renew_before_expiry | default(acme_renewal_days_before_expiry) }} days"
    insertafter: '^\[renewalparams\]'
  loop: "{{ acme_cert_check_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.item.enabled | default(true))
    - not acme_dry_run

- name: Set Correct Permissions on Private Keys
  ansible.builtin.file:
    path: "{{ acme_cert_dir }}/{{ item.name }}/privkey.pem"
    owner: "{{ acme_cert_owner }}"
    group: "{{ acme_cert_group }}"
    mode: "{{ acme_key_mode }}"
  loop: "{{ acme_certificates | selectattr('enabled', 'undefined') | list +
            acme_certificates | selectattr('enabled', 'defined') | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not acme_dry_run
  failed_when: false
