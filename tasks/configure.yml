---
# tasks/configure.yml - Create directories and deploy configuration

# ----------------------------------------------------------------
# Core directories
# ----------------------------------------------------------------

- name: Create ACME Configuration Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ acme_config_dir }}"
    - "{{ acme_work_dir }}"
    - "{{ acme_log_dir }}"
    - "{{ acme_hooks_dir }}"
    - "{{ acme_pre_hook_dir }}"
    - "{{ acme_post_hook_dir }}"
    - "{{ acme_deploy_hook_dir }}"
  loop_control:
    label: "{{ item }}"

- name: Create Combined PEM Directory
  ansible.builtin.file:
    path: "{{ acme_combined_pem_dir }}"
    state: directory
    owner: "{{ acme_cert_owner }}"
    group: "{{ acme_cert_group }}"
    mode: "0750"
  when: acme_certificates | selectattr('combine_pem', 'defined') | selectattr('combine_pem', 'equalto', true) | list | length > 0

- name: Create Certificate Backup Directory
  ansible.builtin.file:
    path: "{{ acme_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: acme_backup_enabled

# ----------------------------------------------------------------
# HTTP-01 webroot
# ----------------------------------------------------------------

- name: Create HTTP-01 Webroot Directory
  ansible.builtin.file:
    path: "{{ acme_http01_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: "{{ acme_http01_webroot_owner }}"
    group: "{{ acme_http01_webroot_group }}"
    mode: "{{ acme_http01_webroot_mode }}"
    recurse: true
  when:
    - acme_http01_create_webroot
    - acme_certificates | selectattr('challenge', 'undefined') | list | length > 0 or
      acme_certificates | selectattr('challenge', 'defined') | selectattr('challenge', 'equalto', 'http-01') | list | length > 0

# ----------------------------------------------------------------
# DNS-01 credentials
# ----------------------------------------------------------------

- name: Deploy DNS Provider Credentials File
  ansible.builtin.template:
    src: dns_credentials.ini.j2
    dest: "{{ acme_dns01_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - acme_dns01_credentials | length > 0
    - acme_dns01_credentials_file | length > 0

# ----------------------------------------------------------------
# Certbot CLI configuration
# ----------------------------------------------------------------

- name: Deploy Certbot CLI Configuration
  ansible.builtin.template:
    src: cli.ini.j2
    dest: "{{ acme_config_dir }}/cli.ini"
    owner: root
    group: root
    mode: "0644"

# ----------------------------------------------------------------
# Custom deploy hooks
# ----------------------------------------------------------------

- name: Deploy Custom Renewal Deploy Hooks
  ansible.builtin.copy:
    dest: "{{ acme_deploy_hook_dir }}/{{ item.name }}.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Auto-generated by Ansible role_acme — do not edit manually.
      set -euo pipefail
      {{ item.content }}
  loop: "{{ acme_renewal_deploy_hooks }}"
  loop_control:
    label: "{{ item.name }}"

# ----------------------------------------------------------------
# Pre/Post hooks
# ----------------------------------------------------------------

- name: Deploy Renewal Pre-Hook Script
  ansible.builtin.copy:
    dest: "{{ acme_pre_hook_dir }}/acme-pre-hook.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Auto-generated by Ansible role_acme — do not edit manually.
      set -euo pipefail
      {{ acme_renewal_pre_hook }}
  when: acme_renewal_pre_hook | length > 0

- name: Deploy Renewal Post-Hook Script
  ansible.builtin.copy:
    dest: "{{ acme_post_hook_dir }}/acme-post-hook.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Auto-generated by Ansible role_acme — do not edit manually.
      set -euo pipefail
      {{ acme_renewal_post_hook }}
  when: acme_renewal_post_hook | length > 0
